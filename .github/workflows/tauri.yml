# Builds the Tauri version of LGM as a clickable app for Windows, macOS
# and Linux: a single .exe, an LGM.app, and an AppImage. Runs on demand
# (Actions tab, "Run workflow") and on tags starting with "v"; the apps
# are attached to the run as artifacts.
name: Tauri build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
          - os: ubuntu-22.04
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Linux dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Windows: the bare exe is the app; the page and sprites are compiled
      # into it, and it runs on the WebView2 runtime Windows 10/11 ships with.
      - name: Build (Windows)
        if: matrix.name == 'windows'
        working-directory: src-tauri
        run: |
          npx --yes @tauri-apps/cli@2 build --no-bundle
          mkdir out
          copy target\release\LGM.exe out\

      # macOS: one LGM.app for Intel and Apple silicon. Zipped with ditto so
      # the executable bits survive the artifact upload (which drops them).
      - name: Build (macOS)
        if: matrix.name == 'macos'
        working-directory: src-tauri
        run: |
          npx --yes @tauri-apps/cli@2 build --target universal-apple-darwin --bundles app
          mkdir out
          ditto -c -k --keepParent target/universal-apple-darwin/release/bundle/macos/LGM.app out/LGM-macos.zip

      # Linux: an AppImage, tarred to keep it executable through the upload.
      - name: Build (Linux)
        if: matrix.name == 'linux'
        working-directory: src-tauri
        run: |
          npx --yes @tauri-apps/cli@2 build --bundles appimage
          mkdir out
          tar -C target/release/bundle/appimage -czf out/LGM-linux.tar.gz LGM_1.0.0_amd64.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: lgm-${{ matrix.name }}
          path: src-tauri/out/*
          if-no-files-found: error
