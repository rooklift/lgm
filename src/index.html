<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'">
	<title>LGM: Bolo Map Editor</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<div id="layout">
		<div id="sidebar">
			<div class="panel">
				<h2>Tools</h2>
				<div id="tools">
					<button class="tool active" data-tool="paint" title="Paint terrain">✏ Paint</button>
					<button class="tool" data-tool="fill" title="Flood fill connected terrain">▨ Fill</button>
					<button class="tool" data-tool="pill" title="Place / move pillboxes">◉ Pill</button>
					<button class="tool" data-tool="base" title="Place / move bases">▣ Base</button>
					<button class="tool" data-tool="start" title="Place / move spawns (must be on deep sea)">▲ Spawn</button>
				</div>
				<label class="row">Brush <select id="brushSize">
					<option value="1">1×1</option>
					<option value="2">2×2</option>
					<option value="3">3×3</option>
					<option value="5">5×5</option>
				</select></label>
			</div>

			<div class="panel">
				<h2>Symmetry</h2>
				<div id="symmetry">
					<button class="sym active" data-sym="off" title="No symmetry">Off</button>
					<button class="sym" data-sym="h" title="Mirror left–right">⇋ H</button>
					<button class="sym" data-sym="v" title="Mirror top–bottom">⇅ V</button>
					<button class="sym" data-sym="quad" title="Mirror into all four quadrants">✛ Quad</button>
					<button class="sym" data-sym="rot180" title="Rotate 180° about the centre">↻ 180°</button>
					<button class="sym" data-sym="rot90" title="Rotate 90° about the centre (four copies)">↻ 90°</button>
				</div>
				<div id="symParity">
					<button class="sympar" data-parity="odd" disabled
						title="Axis through the middle of tile 128 — for odd-sized layouts">Odd axis</button>
					<button class="sympar" data-parity="even" disabled
						title="Axis between tiles 127 and 128 — for even-sized layouts">Even axis</button>
				</div>
			</div>

			<div class="panel">
				<h2>Terrain</h2>
				<div id="palette"></div>
			</div>

			<div class="panel" id="propsPanel">
				<h2>Selected object</h2>
				<div id="props"><span class="hint"><b>Right-click</b> an object to select or drag it.</span></div>
			</div>

		</div>

		<div id="main">
			<canvas id="view"></canvas>
			<div id="status">
				<div id="statusPos"></div>
				<div id="statusInfo">
					<span id="statusTerrain"></span>
					<span id="statusZoom"></span>
					<span id="statusSym"></span>
					<span id="counts"></span>
					<span id="statusHint">wheel: zoom · middle-drag / space-drag: pan · right-click: select object</span>
				</div>
				<div id="statusMessage"></div>
			</div>
		</div>
	</div>
	<script src="format.js"></script>
	<script src="sym.js"></script>
	<script src="renderer.js"></script>
</body>
</html>
