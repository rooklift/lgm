[package]
name = "lgm"
version = "1.0.0"
description = "LGM: Bolo map editor"
edition = "2021"
rust-version = "1.77.2"
license = "GPL-2.0"

[lib]
name = "lgm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
